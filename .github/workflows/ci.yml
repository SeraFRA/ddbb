# CI: il repo si verifica da solo a ogni push.
# Tre livelli: il fossile compila (i suoi bug sono didattici), il corpus
# compila PULITO (-Werror: un warning e' un bug latente, non letteratura),
# e il motore corre sotto ASan+UBSan (offset grezzi per costruzione:
# la memoria si verifica con lo strumento, non solo a occhio). Poi ogni
# capitolo gira come banco di prova: EXIT=0 per tutti o il badge va rosso.
name: ci

on:
  push:
  pull_request:

jobs:
  banchi-di-prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: il fossile deve solo compilare
        run: gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O2 -fsyntax-only database.c

      - name: compila TUTTO con -Werror
        run: >
          make CFLAGS="-Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O2 -Werror"
          LDLIBS="-lm"
          database_debug database_indexed database_compact
          database_persist database_learned database_semantic
          database_ring database_quotient database_persist_semantic
          motore_demo mcp_server demo_mcp prefetch_hook demo_prefetch
          demo_wal misura_fsync demo_multiagente mcp_gateway demo_gateway

      - name: collaudo del motore (ASan + UBSan)
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -o motore_asan motore.c demo_motore.c -lm
          ./motore_asan

      - name: collaudo del layer MCP (ASan + UBSan)
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -o mcp_asan demo_mcp.c mcp_server.c json.c motore.c prefetch.c wal.c -lm
          ./mcp_asan

      - name: collaudo del WAL (ASan + UBSan)
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -o wal_asan demo_wal.c wal.c motore.c -lm
          ./wal_asan

      - name: collaudo del prefetcher speculativo (ASan + UBSan)
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -o prefetch_asan demo_prefetch.c prefetch.c mcp_server.c json.c motore.c wal.c -lm
          ./prefetch_asan

      - name: collaudo del banco multi-sessione (ASan + UBSan)
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -o multiagente_asan demo_multiagente.c prefetch.c mcp_server.c json.c motore.c wal.c -lm
          ./multiagente_asan

      - name: collaudo del gateway (ASan + UBSan)
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -o gateway_asan demo_gateway.c gateway.c mcp_server.c json.c motore.c prefetch.c wal.c -lm
          ./gateway_asan

      - name: "la lavagna vera: gateway vivo, cliente di bash, secondo gateway rifiutato"
        run: |
          rm -f lav_ci.db*
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"salva","arguments":{"nome":"lav_ci.db"}}}\n' | ./mcp_server > /dev/null
          ./mcp_gateway lav_ci.db > /tmp/gw.log 2>&1 &
          GWPID=$!
          for i in $(seq 1 30); do
            PORTA=$(sed -n 's/gateway: 127.0.0.1:\([0-9]*\) .*/\1/p' /tmp/gw.log)
            [ -n "$PORTA" ] && break
            sleep 0.2
          done
          R=$( (exec 3<>/dev/tcp/127.0.0.1/$PORTA; printf '{"jsonrpc":"2.0","id":8,"method":"ping"}\n' >&3; timeout 3 cat <&3) )
          echo "risposta del gateway: $R"
          echo "$R" | grep -q '"result":{}' || { echo "GATE ROTTO: il gateway non risponde al cliente"; exit 1; }
          if printf '{"jsonrpc":"2.0","id":9,"method":"ping"}\n' | ./mcp_gateway lav_ci.db > /tmp/secondo.log 2>&1; then
            echo "GATE [L2] ROTTO: il secondo gateway e' partito"
            exit 1
          fi
          grep -q "I11" /tmp/secondo.log || { echo "il secondo non dichiara la porta occupata"; exit 1; }
          kill $GWPID
          rm -f lav_ci.db* /tmp/gw.log /tmp/secondo.log

      - name: l'hook pre_agent predice, parcheggia e inietta (filo intero)
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"put","arguments":{"chiave":"nota/grammi-posizionali","valore":"i grammi del motore sono posizionali: pos entra nell hash, quindi chiedi e un fuzzy-prefix, non una ricerca per tema"}}}\n{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"salva","arguments":{"nome":"ci_memoria.db"}}}\n' | ./mcp_server > /dev/null
          printf '{"turn_id":"ci-1","prompt":"ricordami il post mortem dei grammi posizionali del motore"}' | ./prefetch_hook ci_memoria.db > hook_out.txt
          grep -q 'hook_specific_output' hook_out.txt
          grep -q 'nota/grammi-posizionali' hook_out.txt
          grep -q '"gen"' ci_memoria.db.prefetch

      - name: il server MCP risponde su stdio
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"ping"}\n' | ./mcp_server > risp.txt
          grep -q '"result":{}' risp.txt

      - name: '[I11] due server veri sullo stesso db: il secondo esce ad alta voce'
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"put","arguments":{"chiave":"padrone","valore":"uno solo"}}}\n{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"salva","arguments":{"nome":"lock_ci.db"}}}\n' | ./mcp_server > /dev/null
          mkfifo fifolungo
          ./mcp_server lock_ci.db < fifolungo > /dev/null 2>&1 &
          exec 9> fifolungo
          sleep 1
          if printf 'ping\n' | ./mcp_server lock_ci.db > secondo.log 2>&1; then
            echo "GATE [I11] ROTTO: il secondo padrone e' partito"
            exit 1
          fi
          grep -q "I11" secondo.log || { echo "il secondo non dichiara la porta occupata"; exit 1; }
          exec 9>&-
          rm -f fifolungo secondo.log lock_ci.db lock_ci.db.wal lock_ci.db.lock

      - name: ogni capitolo e' il proprio banco di prova
        run: |
          stato=0
          for b in database_debug database_indexed database_compact \
                   database_persist database_learned database_semantic \
                   database_ring database_quotient \
                   database_persist_semantic motore_demo demo_mcp \
                   demo_prefetch demo_wal misura_fsync demo_multiagente \
                   demo_gateway; do
            echo "=== $b ==="
            if ./$b; then
              echo "--- $b: verde"
            else
              echo "!!! GATE FALLITO in $b"
              stato=1
            fi
          done
          exit $stato
