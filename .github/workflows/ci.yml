# CI: il repo si verifica da solo a ogni push.
# Tre livelli: il fossile compila (i suoi bug sono didattici), il corpus
# compila PULITO (-Werror: un warning e' un bug latente, non letteratura),
# e il motore corre sotto ASan+UBSan (offset grezzi per costruzione:
# la memoria si verifica con lo strumento, non solo a occhio). Poi ogni
# capitolo gira come banco di prova: EXIT=0 per tutti o il badge va rosso.
name: ci

on:
  push:
  pull_request:

jobs:
  banchi-di-prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: il fossile deve solo compilare
        run: gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O2 -fsyntax-only database.c

      - name: compila TUTTO con -Werror
        run: >
          make CFLAGS="-Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O2 -Werror"
          LDLIBS="-lm"
          database_debug database_indexed database_compact
          database_persist database_learned database_semantic
          database_ring database_quotient database_persist_semantic
          motore_demo mcp_server demo_mcp prefetch_hook demo_prefetch

      - name: collaudo del motore (ASan + UBSan)
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -o motore_asan motore.c demo_motore.c -lm
          ./motore_asan

      - name: collaudo del layer MCP (ASan + UBSan)
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -o mcp_asan demo_mcp.c mcp_server.c json.c motore.c prefetch.c -lm
          ./mcp_asan

      - name: collaudo del prefetcher speculativo (ASan + UBSan)
        run: |
          gcc -Wall -Wextra -Wpedantic -std=c11 -D_POSIX_C_SOURCE=199309L -O1 -g \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -o prefetch_asan demo_prefetch.c prefetch.c mcp_server.c json.c motore.c -lm
          ./prefetch_asan

      - name: l'hook pre_agent predice, parcheggia e inietta (filo intero)
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"put","arguments":{"chiave":"nota/grammi-posizionali","valore":"i grammi del motore sono posizionali: pos entra nell hash, quindi chiedi e un fuzzy-prefix, non una ricerca per tema"}}}\n{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"salva","arguments":{"nome":"ci_memoria.db"}}}\n' | ./mcp_server > /dev/null
          printf '{"turn_id":"ci-1","prompt":"ricordami il post mortem dei grammi posizionali del motore"}' | ./prefetch_hook ci_memoria.db > hook_out.txt
          grep -q 'hook_specific_output' hook_out.txt
          grep -q 'nota/grammi-posizionali' hook_out.txt
          grep -q '"gen"' ci_memoria.db.prefetch

      - name: il server MCP risponde su stdio
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"ping"}\n' | ./mcp_server > risp.txt
          grep -q '"result":{}' risp.txt

      - name: ogni capitolo e' il proprio banco di prova
        run: |
          stato=0
          for b in database_debug database_indexed database_compact \
                   database_persist database_learned database_semantic \
                   database_ring database_quotient \
                   database_persist_semantic motore_demo demo_mcp demo_prefetch; do
            echo "=== $b ==="
            if ./$b; then
              echo "--- $b: verde"
            else
              echo "!!! GATE FALLITO in $b"
              stato=1
            fi
          done
          exit $stato
